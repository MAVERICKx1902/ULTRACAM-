name: Build ULTRACAM APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ULTRACAM-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish to Releases only for pushes (or manual runs) on main — never PRs.
      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="v0.1.0"
          APK_NAME="ULTRACAM-v0.1.0-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          NOTES="First build of ULTRACAM — the liquid prism pro camera.

          squeezes every drop out of your phone's camera hardware: every lens, full-sensor resolution, manual ISO / shutter / kelvin WB / focus, live histogram, focus peaking, horizon level.

          Install
          1. Download $APK_NAME below (Android 8.0+).
          2. Open it from your notification shade or file manager.
          3. When asked, allow \"install unknown apps\" for that app — this is normal for sideloaded apps.
          4. Install, grant camera access when ULTRACAM first opens, and shoot.

          This is a debug build signed with the CI debug key. Photos stay on your device (Pictures/ULTRACAM)."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists — refreshing the APK asset."
            gh release upload "$TAG" "$APK_NAME" --clobber -R "$GITHUB_REPOSITORY"
          else
            echo "Creating release $TAG."
            gh release create "$TAG" "$APK_NAME" \
              --title "ULTRACAM v0.1.0" \
              --notes "$NOTES" \
              -R "$GITHUB_REPOSITORY"
          fi
